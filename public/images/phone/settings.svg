<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<defs>
		<linearGradient id="set" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#C7C7CC" />
			<stop offset="1" stop-color="#7C7C82" />
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="14" fill="url(#set)" />
	<!-- twelve teeth: four per rotation, at 0 / 30 / 60 degrees -->
	<g fill="#3a3a3c">
		<g>
			<rect x="28.5" y="4" width="7" height="12" rx="2" />
			<rect x="28.5" y="48" width="7" height="12" rx="2" />
			<rect x="4" y="28.5" width="12" height="7" rx="2" />
			<rect x="48" y="28.5" width="12" height="7" rx="2" />
		</g>
		<g transform="rotate(30 32 32)">
			<rect x="28.5" y="4" width="7" height="12" rx="2" />
			<rect x="28.5" y="48" width="7" height="12" rx="2" />
			<rect x="4" y="28.5" width="12" height="7" rx="2" />
			<rect x="48" y="28.5" width="12" height="7" rx="2" />
		</g>
		<g transform="rotate(60 32 32)">
			<rect x="28.5" y="4" width="7" height="12" rx="2" />
			<rect x="28.5" y="48" width="7" height="12" rx="2" />
			<rect x="4" y="28.5" width="12" height="7" rx="2" />
			<rect x="48" y="28.5" width="12" height="7" rx="2" />
		</g>
	</g>
	<circle cx="32" cy="32" r="19" fill="#3a3a3c" />
	<circle cx="32" cy="32" r="17" fill="#4a4a4d" />
	<circle cx="32" cy="32" r="8.5" fill="#D1D1D6" />
	<circle cx="32" cy="32" r="4" fill="#3a3a3c" />
</svg>
