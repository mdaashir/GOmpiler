<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<!--
			__TITLE__, __FAVICON__, __THEME_KEY__ and __THEME_DEFAULT__ are replaced at build time from
			content/site.json (see the `portfolio-html-content` plugin in vite.config.ts).
		-->
		<link rel="icon" type="image/x-icon" href="__FAVICON__" />
		<link rel="icon" type="image/svg+xml" href="/macbook.png" />
		<!-- `viewport-fit=cover` lets the phone shell pad around the notch and home indicator. -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Playwrite+US+Trad:wght@100..400&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"
		/>
		<script>
			// Apply the persisted appearance before first paint so there is no flash.
			try {
				var stored = localStorage.getItem('__THEME_KEY__');
				var theme = stored || '__THEME_DEFAULT__';
				if (theme !== 'light') document.documentElement.classList.add('dark');
			} catch (e) {}
		</script>
		<title>__TITLE__</title>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this site.</noscript>
		<div id="app"></div>
		<script prerender type="module" src="/src/index.tsx"></script>
	</body>
</html>
